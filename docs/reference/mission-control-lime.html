function itemsPage(){const list=filteredItems();page=Math.min(page,Math.max(1,Math.ceil(list.length/7)));let title='Items',sub='Everything in motion, in one place.';if(scope?.kind==='person'){title=person(scope.id)?.name||'Items';sub='Open work and shared next steps.'}if(scope?.kind==='tag'){title=state.tags.find(t=>t.id===scope.id)?.name||'Items';sub='All the work connected to this tag.'}let out=header(title,sub,'items','new-item','New item')+`<div class="tabs view-tabs">${tabsHtml([['all','All items',openItems().length],['needs','Needs you',count('needs')],['waiting','Waiting on others',count('waiting')],['completed','Completed']])}<div class="tabs view-toggle" style="margin-left:auto">${btn(icon('list')+'List','layout','data-layout="list"',layout==='list'?'active':'')}${btn(icon('board')+'Board','layout','data-layout="board"',layout==='board'?'active':'')}</div></div>`;if(scope||query||globalStatus||globalTag||globalPerson||globalDate)out+=`<div class="panel filter-banner">${icon('sliders','small')}<span>${list.length} matching items${query?' · “'+esc(query)+'”':''}${scope?' · '+esc(scope.kind==='untagged'?'Untagged':title):''}</span>${btn('Clear filters ×','clear','','textbtn')}</div>`;if(layout==='board'){out+=`<div class="board">${['needs','waiting','progress','completed'].filter(s=>s!=='completed'||tab==='completed'||globalStatus==='completed').map(s=>`<section class="panel board-column"><h3>${statusPill(s)} <span class="counter">${list.filter(i=>i.status===s).length}</span></h3>${list.filter(i=>i.status===s).map(i=>btn(`<strong>${esc(i.title)}</strong><p class="small">${esc(i.summary)}</p><div class="between">${avatar(i.owner)}<span class="tagchip">${esc(i.tags[0]||'Untagged')}</span></div>`,'open',`data-id="${i.id}"`,'board-item')).join('')||'<p class="small">Nothing here.</p>'}</section>`).join('')}</div>`;return out}
return out+`<section class="panel table-panel"><div class="between table-toolbar"><select class="select" id="item-status" aria-label="Item status"><option value="all" ${tab==='all'?'selected':''}>Open items</option><option value="needs" ${tab==='needs'?'selected':''}>Needs you</option><option value="waiting" ${tab==='waiting'?'selected':''}>Waiting</option><option value="completed" ${tab==='completed'?'selected':''}>Completed</option></select><select class="select" id="item-sort" aria-label="Sort items"><option value="priority" ${sort!=='name'?'selected':''}>Priority ↓</option><option value="name" ${sort==='name'?'selected':''}>Name A–Z</option></select></div><div class="table-wrap"><table class="items-table"><thead><tr><th></th><th>Item</th><th></th><th>Status</th><th>Owner</th><th>Updated</th><th></th></tr></thead><tbody>${list.slice((page-1)*7,page*7).map((i,index)=>`<tr class="${index===0?'highlight':''}"><td><input class="check" type="checkbox" aria-label="${i.status==='completed'?'Reopen':'Complete'} ${esc(i.title)}" data-complete="${i.id}" ${i.status==='completed'?'checked':''}></td><td class="title-cell" data-action="open" data-id="${i.id}">${btn(esc(i.title),'open',`data-id="${i.id}"`,'item-title')}<div class="item-sub">${esc(i.summary)}</div></td><td><span class="tagchip">${esc(i.tags[0]||'Untagged')}</span></td><td>${statusPill(i.status)}</td><td><div class="row nowrap">${avatar(i.owner)}${esc(ownerName(i.owner))}</div></td><td class="nowrap">${esc(i.updated)}</td><td><div class="table-actions">${index===0?btn('Open','open',`data-id="${i.id}"`)+btn(icon('check'),'complete',`data-id="${i.id}" aria-label="Complete item"`,'iconbtn'):btn(icon('more'),'item-menu',`data-id="${i.id}" aria-label="Actions for ${esc(i.title)}"`,'iconbtn ghost')}</div></td></tr>`).join('')}</tbody></table></div>${!list.length?empty():''}${pagination(list.length,7)}</section><div class="panel bottom-strip row">${emblem('cube')}<div class="grow"><strong>A little progress, every day.</strong></div><span>${count('completed')} items completed today · +${count('completed')*20} XP</span></div>`.replace('<div class="panel bottom-strip row"><svg','<div class="panel bottom-strip row"><svg style="width:55px;height:48px"')}
function sourceRows(){return [['spark','Slack conversation'],['doc','Q4 roadmap · Document'],['doc','Planning meeting · Notes']].map(([ic,t],index)=>btn(icon(ic)+esc(t)+icon('external','small'),'source',`data-source="${index}"`,'source-row')).join('')}
function detailPage(){const i=state.items.find(x=>x.id===itemId)||state.items[0],p=person(i.person);itemId=i.id;let body='';if(detailTab==='Overview')body=`<h2>The brief</h2><p class="brief">${i.id===1?'Align the Q4 priorities before the team planning session. Alex has shared the updated draft and needs your sign-off.':esc(i.summary)+' Review the linked context, confirm the next steps, and share your feedback with '+esc(p?.name.split(' ')[0]||'the team')+'.'}</p><h2>Before you close this</h2><div class="checklist">${(i.id===1?['Read the updated draft','Confirm priorities and scope','Share your feedback with Alex']:['Review the available context','Confirm the next steps','Share an update with the team']).map((t,n)=>`<label><input type="checkbox" class="check" data-check="${n}" ${i.checks[n]?'checked':''}>${t}</label>`).join('')}</div><section class="conversation"><div class="between"><h2>Latest conversation</h2>${btn('<span style="color:#d2ad7c">✣</span> Slack '+icon('external','small'),'source','data-source="0"','tagchip')}</div><div class="message">${avatar(i.person)}<div class="message-body"><strong>${esc(p?.name||'Alex Morgan')} <time>· Today, 10:42</time></strong><p>${i.id===1?'Updated the roadmap with the team’s feedback. Can you give it a final review?':esc(i.summary)+' Can you take a look at the next steps?'}</p></div></div><div class="message">${avatar(0)}<div class="message-body"><strong>You <time>· Today, 11:08</time></strong><p>I’ll check the priorities and get back to you.</p></div></div>${i.notes.map(n=>`<div class="message">${avatar(0)}<div class="message-body"><strong>You <time>· Private note · ${esc(n.time)}</time></strong><p style="white-space:pre-wrap">${esc(n.text)}</p></div></div>`).join('')}<form id="note-form" class="note-box"><textarea id="note-text" name="note" aria-label="Private note" placeholder="Add a private note…" required></textarea><button type="submit" class="primary">Save note</button></form></section>`;else if(detailTab==='Activity')body=`<h2>Item activity</h2><div class="message">${icon('download')}<div><strong>Imported from Slack</strong><p>Today, 09:24 · System</p></div></div><div class="message">${icon('flag')}<div><strong>Priority set to ${i.priority}</strong><p>Today, 10:12 · You</p></div></div><div class="message">${icon('user')}<div><strong>Assigned to ${esc(ownerName(i.owner))}</strong><p>Current owner</p></div></div>${state.activity.filter(a=>a.text.includes(i.title)).map(a=>`<div class="message">${icon(a.icon)}<div><strong>${esc(a.text)}</strong><p>${esc(a.time)} · ${esc(a.actor)}</p></div></div>`).join('')}`;else body=`<h2>Linked sources</h2><p class="brief">Mock source previews for this prototype.</p>${sourceRows()}`;
return `<div class="breadcrumb"><div class="row">${btn(icon('back')+'Items','navigate','data-view="items"','textbtn')}<span class="muted">/</span><span>${esc(i.title)}</span></div><div class="row">${btn(icon('back')+'<span class="hide-mobile">Previous item</span>','adjacent','data-dir="-1" aria-label="Previous item"')}${btn('<span class="hide-mobile">Next item</span>'+icon('chevron'),'adjacent','data-dir="1" aria-label="Next item"')}</div></div><div class="page-head detail-head">${emblem('cube')}<div class="grow"><h1>${esc(i.title)}</h1><p class="subtitle">${esc(i.summary)}</p><div class="pills">${statusPill(i.status)}${i.tags.slice(0,2).map(t=>`<span class="tagchip">${esc(t)}</span>`).join('')}</div></div><div class="header-actions">${btn(icon('check')+(i.status==='completed'?'Reopen':'Mark done'),'complete',`data-id="${i.id}"`,'primary')}${btn(icon('user')+'Assign to…','assign',`data-id="${i.id}"`)}${btn(icon('more'),'item-menu',`data-id="${i.id}" aria-label="More item actions"`,'iconbtn')}</div></div><section class="panel accent next-move">${icon('target')}<div class="grow"><div class="eyebrow">${i.status==='completed'?'MISSION COMPLETE':'YOUR NEXT MOVE'}</div><h2>${i.status==='completed'?'All done. Keep the momentum going.':i.id===1?'Review the roadmap and share your feedback':'Review the context and confirm the next step'}</h2><p>${i.id===1?'Focus on priorities, scope and delivery dates.':'Everything you need is linked below.'}</p></div>${btn((i.id===1?'Open roadmap':'Open context')+icon('external'),'source','data-source="1"','primary')}</section><div class="detail-grid"><section class="panel detail-content"><div class="tabs detail-tabs">${['Overview','Activity','Sources'].map(t=>btn(t+(t==='Sources'?' <span class="counter">3</span>':''),'detail-tab',`data-tab="${t}"`,`tab ${detailTab===t?'active':''}`)).join('')}</div><div class="detail-body">${body}</div></section><aside class="stack"><div class="panel detail-card"><h3>Details</h3><div class="detail-row">${icon('user','small')}<span class="label">Owner</span>${btn(esc(ownerName(i.owner)),'assign',`data-id="${i.id}"`,'textbtn')}</div><div class="detail-row">${icon('hourglass','small')}<span class="label">Waiting on</span><span>${i.status==='completed'?'Nothing — done':i.status==='waiting'?esc(ownerName(i.owner)):'Your review'}</span></div><div class="detail-row">${icon('flag','small')}<span class="label">Priority</span>${btn(`<span class="pill needs">${i.priority>=80?'High':i.priority>=60?'Medium':'Low'}</span>`,'edit-item',`data-id="${i.id}"`,'textbtn')}</div><div class="detail-row">${icon('calendar','small')}<span class="label">Due</span>${btn(esc(i.due),'edit-item',`data-id="${i.id}"`,'textbtn')}</div><div class="detail-row">${icon('tag','small')}<span class="label">Tags</span><div class="row" style="gap:6px;flex-wrap:wrap">${i.tags.map(t=>`<span class="tagchip">${esc(t)}</span>`).join('')}</div></div><div class="detail-row">${icon('people','small')}<span class="label">People</span><div class="row small" style="gap:7px">${avatar(0)}You ${avatar(i.person)}${esc(p?.name.split(' ')[0]||'Alex')}</div></div></div><div class="panel detail-card"><h3>Linked sources</h3>${sourceRows()}<p class="source-date">Updated 12 minutes ago</p></div></aside></div>`}
function activityRows(all=false){return state.activity.filter(a=>activityTab==='All'||(activityTab==='You'?a.actor==='You':a.actor!=='You')).slice(0,all?100:5).map(a=>`<div class="activity-row">${icon(a.icon)}<span>${esc(a.text)}</span><span class="actor">${esc(a.actor)}</span><time>${esc(a.time)}</time></div>`).join('')||'<p class="empty">No activity yet.</p>'}
function todayPriority(item){if(!item)return '';const level=item.priority>=80?'High':item.priority>=60?'Medium':'Low';return `<span class="today-priority" tabindex="0" data-score="${item.priority}" aria-label="${level} priority, score ${item.priority}">${level}<span class="priority-tooltip" role="tooltip">Priority score: ${item.priority}</span></span>`}
function carousel(kind,title,ic){let list=kind==='suggestions'?state.suggestions:state.items.filter(i=>i.status===kind);let n=carousels[kind]%Math.max(1,list.length),it=list[n];const ticket=kind==='suggestions'?state.items.find(i=>i.id===it?.item):it;return `<section class="panel carousel ${it&&kind!=='suggestions'?'clickable-ticket':''}" ${it&&kind!=='suggestions'?`data-action="open" data-id="${it.id}"`:''}><div class="row">${icon(ic)}${title}<span class="counter">${list.length}</span>${btn(icon('more'),'carousel-list',`data-kind="${kind}" aria-label="View ${title}"`,'textbtn')}</div><div class="today-ticket-heading"><h2>${it&&kind!=='suggestions'?`<a class="today-ticket-link" href="#item/${it.id}" data-action="open" data-id="${it.id}">${esc(it.title)}</a>`:it?esc(it.title):'All clear'}</h2>${todayPriority(ticket)}</div><p>${it?esc(it.summary):'Nothing waiting here. Nice work.'}</p><div class="carousel-controls">${btn(icon('back'),'carousel',`data-kind="${kind}" data-dir="-1" aria-label="Previous ${title}" ${list.length<2?'disabled':''}`,'round')}${btn(icon(kind==='suggestions'?'spark':'check')+(kind==='suggestions'?'Accept':'Done'),kind==='suggestions'?'accept':'complete',`data-id="${it?.id||0}" ${!it?'disabled':''}`,'primary')}${btn(icon('chevron'),'carousel',`data-kind="${kind}" data-dir="1" aria-label="Next ${title}" ${list.length<2?'disabled':''}`,'round')}</div><div class="carousel-index">${list.length?n+1:0} of ${list.length}</div></section>`}
function todayPage(){const next=state.items.find(i=>i.status==='needs')||openItems()[0];return `<div class="greeting"><h1>Good evening, Guy.</h1><p>${openItems().length} open items · ${count('needs')} need you · ${count('waiting')} waiting on others · ${state.suggestions.length} suggestions</p>${btn(icon('plus')+'New item','new-item','','primary')}</div><section class="panel accent today-hero">${emblem('cube')}<div class="grow"><div class="today-hero-label"><div class="eyebrow">NEXT BEST MOVE</div>${todayPriority(next)}</div><h2>${next?esc(next.id===1?'Review the Q4 roadmap':next.title):'You’re all caught up'}</h2><p>${next?esc(next.summary):'Enjoy the space you’ve made.'}</p></div>${next?`<div class="actions">${btn('Open item','open',`data-id="${next.id}"`)}${btn(icon('check')+'Mark done','complete',`data-id="${next.id}"`,'primary')}${btn(icon('user')+'Assign to…'+icon('down','small'),'assign',`data-id="${next.id}"`)}</div>`:''}</section><div class="carousel-grid">${carousel('needs','Needs you','target')}${carousel('waiting','Waiting on others','hourglass')}${carousel('suggestions','Suggestions','spark')}</div><section class="panel activity"><div class="panel-heading"><h2>Activity log</h2><p>Everything that happened</p><div class="tabs">${['All','You','System'].map(t=>btn(t,'activity-tab',`data-tab="${t}"`,`tab ${activityTab===t?'active':''}`)).join('')}</div>${btn('View all '+icon('arrow','small'),'activity-all','','textbtn')}</div>${activityRows()}</section><section class="panel completed-panel"><div class="panel-heading"><h2>Today’s completed tasks</h2><p>${count('completed')} completed · +${count('completed')*20} XP</p>${btn('Open archive '+icon('arrow','small'),'archive','','textbtn') .replace('class="textbtn"','class="textbtn" style="margin-left:auto"')}</div><div class="completed-grid">${state.items.filter(i=>i.status==='completed').slice(-3).map((i,n)=>`<div class="completed-card"><div class="medal">${emblem(['chip','cube','rings'][n])}</div><div>${btn(esc(i.title),'open',`data-id="${i.id}"`,'item-title')}<p>Completed at ${esc(i.completedTime||'just now')}</p></div></div>`).join('')||'<p class="empty">Your completed items will appear here.</p>'}</div></section>`}

function navigate(v,opts={}){view=v;tab=opts.tab||'all';page=1;localQuery='';scope=opts.scope||null;sort=v==='items'?'priority':'activity';if(v==='detail'){itemId=Number(opts.id)||1;detailTab='Overview'}history.replaceState(null,'','#'+(v==='detail'?'item/'+itemId:v));$('#sidebar').classList.remove('open');$('.sidebar-backdrop')?.remove();render();window.scrollTo(0,0)}
function complete(id){const i=state.items.find(x=>x.id===Number(id));if(!i)return;backup();if(i.status==='completed'){i.status='needs';i.owner=0;log(`Reopened ${i.title}`,'reset');toast('Item reopened',true)}else{i.status='completed';i.completedTime=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});i.updated='Today';state.questClosed++;log(`You completed ${i.title}`);toast('Item complete · +20 XP',true);if(state.sound)playSound()}save();render()}
function playSound(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(660,ctx.currentTime);o.frequency.setValueAtTime(880,ctx.currentTime+.09);g.gain.setValueAtTime(.05,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.3);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.3);o.onended=()=>ctx.close()}catch{}}
function openModal(title,content,formName='',id=''){const d=$('#dialog');d.innerHTML=`<div class="between" style="margin-bottom:17px"><h2>${esc(title)}</h2>${btn(icon('close'),'close-dialog','aria-label="Close dialog"','iconbtn ghost')}</div>${formName?`<form data-form="${formName}" data-id="${id}">${content}<div class="modal-footer">${btn('Cancel','close-dialog','type="button"')}<button class="primary" type="submit">Save</button></div></form>`:content}`;d.showModal()}

function tagForm(id){const t=state.tags.find(t=>t.id===Number(id));openModal(t?'Edit tag':'New tag',`<label>Name<input name="name" required maxlength="35" value="${esc(t?.name||'')}"></label><label>Description<input name="description" required maxlength="100" value="${esc(t?.description||'')}"></label><label>Accent color<input type="color" name="color" value="${t?.color||'#dca666'}"></label>`,'tag',t?.id||'')}
function accept(id){const s=state.suggestions.find(s=>s.id===Number(id));if(!s)return;backup();const i=state.items.find(i=>i.id===s.item);if(s.id===1){i.status='completed';i.completedTime='Just now';state.questClosed++}else if([2,7].includes(s.id)){const tag=s.id===2?'Engineering':'Operations';if(!i.tags.includes(tag))i.tags.push(tag);state.questTidy++}else if(s.id===8)i.priority=95;else{i.notes.push({text:'Accepted suggestion: '+s.summary,time:'Just now'})}state.suggestions=state.suggestions.filter(x=>x.id!==s.id);state.questSuggestions++;log('Suggestion accepted · '+s.title,'spark');save();render();toast('Suggestion applied',true)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;if(b.tagName==='A')e.preventDefault();const a=b.dataset.action,id=Number(b.dataset.id);if(a==='navigate')navigate(b.dataset.view);else if(a==='open')navigate('detail',{id});else if(a==='tab'){if(b.dataset.tab==='untagged'){navigate('items',{scope:{kind:'untagged'}});return}tab=b.dataset.tab;page=1;render(false)}else if(a==='page'){page=Number(b.dataset.page);render(false);window.scrollTo({top:0,behavior:'smooth'})}else if(a==='layout'){layout=b.dataset.layout;render(false)}else if(a==='complete')complete(id);else if(a==='scope')navigate('items',{scope:{kind:b.dataset.kind,id}});else if(a==='favorite'){const obj=state[b.dataset.kind].find(x=>x.id===id);obj.favorite=!obj.favorite;save();render(false)}else if(a==='detail-tab'){detailTab=b.dataset.tab;render(false)}else if(a==='adjacent'){const index=state.items.findIndex(i=>i.id===itemId);navigate('detail',{id:state.items[(index+Number(b.dataset.dir)+state.items.length)%state.items.length].id})}else if(a==='new-item')itemForm();else if(a==='edit-item'){ $('#dialog').close();itemForm(id)}else if(a==='assign'){ $('#dialog').close();assign(id)}else if(a==='new-person')openModal('Add person','<label>Name<input name="name" required maxlength="60" placeholder="Full name"></label><label>Role or team<input name="role" required maxlength="60" placeholder="Engineering, Product…"></label>','person');else if(a==='new-tag'||a==='edit-tag')tagForm(id);else if(a==='close-dialog')$('#dialog').close();else if(a==='item-menu')openModal('Item actions',`<div class="stack">${btn(icon('doc')+'Edit details','edit-item',`data-id="${id}"`)}${btn(icon('user')+'Assign item','assign',`data-id="${id}"`)}${btn(icon('check')+'Toggle completed','modal-complete',`data-id="${id}"`)}</div>`);else if(a==='modal-complete'){$('#dialog').close();complete(id)}else if(a==='clear'){query='';localQuery='';globalStatus='';globalTag='';globalPerson='';globalDate='';scope=null;tab='all';page=1;render()}else if(a==='theme'){state.theme=state.theme==='dark'?'light':'dark';save();render()}else if(a==='sound'){state.sound=!state.sound;save();shell();toast('Completion sound '+(state.sound?'on':'off'));if(state.sound)playSound()}else if(a==='settings')openModal('Prototype settings',`<p style="margin-bottom:18px">A self-contained demo. All changes stay in this browser; no external accounts are connected.</p><div class="stack">${btn(icon('sun')+'Switch theme','theme')}${btn(icon('sound')+'Toggle completion sound','sound')}${btn(icon('reset')+'Reset mock data','reset')}</div>`);else if(a==='reset'){ $('#dialog').close();openModal('Reset the demo?',`<p>This restores the original mock items, people and tags, and clears your local changes.</p><div class="modal-footer">${btn('Cancel','close-dialog')}${btn('Reset demo','confirm-reset','','primary')}</div>`)}else if(a==='confirm-reset'){state=seed();save();$('#dialog').close();query='';globalStatus='';globalTag='';globalPerson='';globalDate='';navigate('today');toast('Demo restored')}else if(a==='undo'&&undoState){state=undoState;undoState=null;save();render();toast('Change undone')}else if(a==='carousel'){const kind=b.dataset.kind,len=kind==='suggestions'?state.suggestions.length:count(kind);carousels[kind]=(carousels[kind]+Number(b.dataset.dir)+len)%Math.max(1,len);render(false)}else if(a==='carousel-list'){navigate(b.dataset.kind==='suggestions'?'suggestions':'items',{tab:b.dataset.kind})}else if(a==='accept')accept(id);else if(a==='dismiss'){backup();state.suggestions=state.suggestions.filter(s=>s.id!==id);save();render();toast('Suggestion dismissed',true)}else if(a==='activity-tab'){activityTab=b.dataset.tab;render(false)}else if(a==='activity-all')openModal('Activity log',`<div style="max-height:65vh;overflow:auto">${activityRows(true)}</div>`);else if(a==='archive')navigate('items',{tab:'completed'});else if(a==='untagged')navigate('items',{scope:{kind:'untagged'}});else if(a==='source'){const si=Number(b.dataset.source);openModal(['Slack conversation','Q4 roadmap · Document','Planning meeting · Notes'][si],['<p class="eyebrow">MOCK SLACK PREVIEW · #planning</p><div class="message"><div><strong>Alex Morgan · Today, 10:42</strong><p>Updated the roadmap with the team’s feedback. Can you give it a final review?</p></div></div><div class="message"><div><strong>You · Today, 11:08</strong><p>I’ll check the priorities and get back to you.</p></div></div>','<p class="eyebrow">MOCK DOCUMENT PREVIEW</p><h3 style="margin:16px 0">Q4 priorities</h3><ol style="line-height:2"><li>Improve retrieval and evaluation quality.</li><li>Align the developer AI workflows.</li><li>Deliver the onboarding assistant milestone.</li></ol><p>Decision needed: confirm scope and delivery dates.</p>','<p class="eyebrow">MOCK MEETING NOTES</p><h3 style="margin:16px 0">Planning session</h3><p>Alex will consolidate the roadmap. Guy will review the priorities. Team leads will confirm capacity before the next planning session.</p>'][si])}else if(a==='menu'){$('#sidebar').classList.add('open');const d=document.createElement('div');d.className='sidebar-backdrop';d.onclick=()=>{$('#sidebar').classList.remove('open');d.remove()};document.body.append(d)}});
document.addEventListener('input',e=>{if(e.target.id==='global-search'){query=e.target.value;if(view!=='items'){view='items';tab='all';page=1;scope=null;history.replaceState(null,'','#items');$('#sidebar').querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view==='items'))}page=1;render(false)}else if(e.target.id==='local-search'){localQuery=e.target.value;page=1;const start=e.target.selectionStart;render(false);$('#local-search').focus();$('#local-search').setSelectionRange(start,start)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.complete){complete(Number(t.dataset.complete));return}if(t.dataset.check!==undefined){state.items.find(i=>i.id===itemId).checks[Number(t.dataset.check)]=t.checked;save();return}if(t.id.startsWith('global-')){if(t.id==='global-status')globalStatus=t.value;if(t.id==='global-tag')globalTag=t.value;if(t.id==='global-person')globalPerson=t.value;if(t.id==='global-date')globalDate=t.value;view='items';page=1;tab='all';scope=null;history.replaceState(null,'','#items');render()}else if(t.id==='item-status'){tab=t.value;globalStatus='';page=1;render()}else if(t.id==='item-sort'||t.id==='collection-sort'){sort=t.value;page=1;render(false)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=new FormData(f);if(f.id==='note-form'){const text=d.get('note').trim();if(!text)return;const i=state.items.find(i=>i.id===itemId);i.notes.push({text,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});log('Added a note to '+i.title,'doc');save();render(false);toast('Private note saved');return}const kind=f.dataset.form,id=Number(f.dataset.id);backup();if(kind==='item'){const tag=d.get('tag'),data={title:d.get('title').trim(),summary:d.get('summary').trim(),priority:Number(d.get('priority')),due:d.get('due'),updated:'Today'};if(!data.title||!data.summary)return;if(id){const i=state.items.find(i=>i.id===id);Object.assign(i,data);i.tags=tag?[tag,...i.tags.slice(1).filter(t=>t!==tag)]:[];log('Updated '+i.title,'doc')}else{state.items.unshift({...data,id:Math.max(...state.items.map(i=>i.id))+1,tags:tag?[tag]:[],status:'needs',person:1,owner:0,checks:[false,false,false],notes:[]});log('Created '+data.title,'plus')}}else if(kind==='assign'){const i=state.items.find(i=>i.id===id),owner=Number(d.get('owner'));i.owner=owner;i.status=owner?'waiting':'needs';if(owner)i.person=owner;i.summary=owner?'Waiting on '+person(owner).name+'.':'Your review is next.';log(i.title+' assigned to '+(person(owner)?.name||'You'),'user')}else if(kind==='person'){const name=d.get('name').trim();if(!name)return;state.people.push({id:Math.max(...state.people.map(p=>p.id))+1,name,role:d.get('role').trim(),initials:name.split(/\s+/).slice(0,2).map(s=>s[0]).join('').toUpperCase(),favorite:false})}else if(kind==='tag'){const name=d.get('name').trim();if(!name)return;if(state.tags.some(t=>t.id!==id&&t.name.toLowerCase()===name.toLowerCase())){toast('That tag already exists');return}if(id){const t=state.tags.find(t=>t.id===id),old=t.name;t.name=name;t.description=d.get('description');t.color=d.get('color');state.items.forEach(i=>i.tags=i.tags.map(v=>v===old?name:v));if(globalTag===old)globalTag=name}else state.tags.push({id:Math.max(...state.tags.map(t=>t.id))+1,name,description:d.get('description'),color:d.get('color'),icon:'tag',favorite:false});state.questTidy++}save();$('#dialog').close();render();toast('Saved',true)});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!$('#dialog').open){e.preventDefault();$('#global-search').focus()}if(e.key==='Escape'){$('#sidebar').classList.remove('open');$('.sidebar-backdrop')?.remove()}});
function route(){const hash=location.hash.slice(1);if(hash.startsWith('item/')){itemId=Number(hash.split('/')[1])||1;view='detail'}else if(['today','items','people','tags','suggestions'].includes(hash))view=hash;render()}window.addEventListener('hashchange',route);route();
</script></body></html>
